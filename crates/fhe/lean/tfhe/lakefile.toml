name = "MxxFheTfhe"
version = "0.1.0"
defaultTargets = ["TfheGenerated", "MxxFheTfhe"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../../ir-core/lean/.lake/packages/mathlib"

[[require]]
name = "mxx-ir-core"
path = "../../../ir-core/lean"

# VCVio and its own requirements are shared with `mxx-security`, which pins them.
[[require]]
name = "VCVio"
path = "../../../ir-core/lean/security/.lake/packages/VCVio"

[[require]]
name = "PolyFun"
path = "../../../ir-core/lean/security/.lake/packages/PolyFun"

[[require]]
name = "QuantumFoundations"
path = "../../../ir-core/lean/security/.lake/packages/QuantumFoundations"

[[require]]
name = "cslib"
path = "../../../ir-core/lean/security/.lake/packages/cslib"

[[require]]
name = "mxx-security"
path = "../../../ir-core/lean/security"

[[require]]
name = "mxx-fhe"
path = "../spec"

# Modules written by the host-only `export_claims` example (`tfhe`).
[[lean_lib]]
name = "TfheGenerated"
srcDir = "generated"
roots = ["Backend", "Keygen", "Encrypt", "Eval", "Decrypt_0", "Decrypt_1", "Plain", "Scheme"]

# Handwritten proofs of the generated claims.
[[lean_lib]]
name = "MxxFheTfhe"
roots = ["Certificate", "TfheBase", "TfheBridge", "TfheStages", "TfheEncrypt", "TfheKeygen", "TfheEval", "TfheRun", "TfhePhase", "TfheRotation", "TfheFresh", "TfheNand", "TfheMS", "TfheInput", "TfheBrNoise", "TfheOutput", "TfheCorrectness"]
