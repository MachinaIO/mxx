[package]
name = "mxx-fhe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ring-GSW and leveled BGV graph builders for the mxx DSL"
autotests = false

[[test]]
name = "gpu_bgv_round_trip"
required-features = ["gpu"]

[[test]]
name = "gpu_ring_gsw_round_trip"
required-features = ["gpu"]

[features]
default = []
gpu = ["mxx-primitives/gpu", "mxx-runtime/gpu"]

[dependencies]
mxx-dsl.workspace = true
mxx-ir-core.workspace = true
mxx-primitives.workspace = true
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
bigdecimal.workspace = true
sha2.workspace = true
mxx-runtime.workspace = true
rand.workspace = true
serde_json.workspace = true
