name: CI runner
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt
      - run: cargo +nightly-2026-07-25 fmt --all --check

  run:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-25
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgmp-dev libasound2-dev

      - name: Checkout OpenFHE
        uses: actions/checkout@v4
        with:
          repository: MachinaIO/openfhe-development
          ref: main
          path: openfhe


      - name: Build OpenFHE
        run: |
          cd openfhe
          mkdir -p build && cd build
          cmake .. -DWITH_OPENMP=OFF
          make -j"$(nproc)"
          sudo make install

      - name: Update dynamic linker cache
        run: |
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/openfhe.conf
          sudo ldconfig

      - name: Verify OpenFHE installation
        run: ls -lah /usr/local/lib | grep OpenFHE

      - name: Test Lean freshness checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_lean_claims.py'

      - name: Check generated Lean claim freshness (no GPU)
        run: python3 scripts/check_lean_claims.py

      - name: Run clippy memory
        run: cargo +nightly-2026-07-25 clippy --workspace --all-targets
        env:
          RUSTFLAGS: -A unused

      - name: Run test
        run: RUST_TEST_NOCAPTURE=1 cargo test -r --workspace --lib -- --test-threads=1

  lean:
    name: Lean proofs (4.28.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.28.0
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify proof toolchains
        run: |
          for package in crates/ir-core/lean crates/fhe/lean/tfhe crates/fhe/lean/bgv crates/dsl/examples/rlwe; do
            test "$(cat "$package/lean-toolchain")" = "leanprover/lean4:v4.28.0"
          done
          lean --version
      - name: Fetch mathlib and its compiled cache
        working-directory: crates/ir-core/lean
        run: lake exe cache get
      - name: Build shared IR and runtime proofs
        working-directory: crates/ir-core/lean
        run: lake build
      - name: Build TFHE certificate
        working-directory: crates/fhe/lean/tfhe
        run: lake build
      - name: Build BGV certificate
        working-directory: crates/fhe/lean/bgv
        run: lake build
      - name: Build RLWE certificate
        working-directory: crates/dsl/examples/rlwe
        run: lake build

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - run
      - fmt
      - lean
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
