[package]
name = "mxx-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative typed DSL for mxx executable graphs and pure correctness specs"

[dependencies]
mxx-ir-core.workspace = true
num-bigint.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
default = []
# Enables the GPU backend for the examples; the library itself has no GPU code.
gpu = ["mxx-backends/gpu"]

[dev-dependencies]
bigdecimal.workspace = true
mxx-backends.workspace = true
serde_json.workspace = true

[[example]]
name = "rlwe_encrypt"
required-features = ["gpu"]
