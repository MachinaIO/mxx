name = "MxxKhe"
version = "0.1.0"
defaultTargets = ["MxxKhe"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../ir-core/lean/.lake/packages/mathlib"

[[require]]
name = "mxx-ir-core"
path = "../../ir-core/lean"

[[lean_lib]]
name = "MxxKhe"
roots = [
  "BggEncoding",
  "BggMultiplication",
  "GadgetsDecomposition",
  "GadgetsGadgetMatrix",
  "MxxKhe",
]
