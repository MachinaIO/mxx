name = "MxxExponentLutLwrAverageN32Crt7x40"
version = "0.1.0"
defaultTargets = ["LwrGenerated", "LwrProof"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLutLwr"
path = ".."

# Modules written by `lwr_prf_end_to_end` (`tests/lwr_prf.rs`) for this parameter set.
[[lean_lib]]
name = "LwrGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_payload", "Stage_mask",
  "Stage_preprocess", "Stage_encrypt", "Stage_online_eval", "Stage_decode"
]

# The proof of the generated claim.
[[lean_lib]]
name = "LwrProof"
roots = ["LwrSetup", "LwrInputs", "LwrEncrypt", "LwrPreprocess", "LwrBlock0", "LwrBlock1", "LwrBlock2", "LwrBlock3", "LwrBlock4", "LwrLut", "LwrCertificate"]

# Phase 4 prototypes of the explicit-error proof (not a default target).
[[lean_lib]]
name = "LwrH2Scratch"
roots = ["LwrEncryptE", "LwrPreprocessE", "LwrErrorCommon", "LwrBlockE0", "LwrBlockE1", "LwrBlockE2", "LwrBlockE3", "LwrBlockE4", "LwrLutE", "LwrModelBase", "LwrModel0", "LwrModel1", "LwrModel2", "LwrModel3", "LwrModel4", "LwrModelLut", "LwrChain", "LwrChainAll", "LwrChainFinal", "LwrH2Model", "LwrH2Bounds", "LwrH2Agree", "LwrH2Cert"]
moreLeanArgs = ["--tstack=4000000"]
