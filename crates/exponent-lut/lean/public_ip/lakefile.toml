name = "MxxExponentLutPublicIp"
version = "0.1.0"
defaultTargets = ["MxxExponentLutPublicIp"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLut"
path = ".."

# Lemmas about the public inner-product programs of `tests/public_ip.rs` that hold at every
# parameter set.
[[lean_lib]]
name = "MxxExponentLutPublicIp"
roots = ["PublicIpProgram"]
