name = "MxxKheRingGswBggAverageGsw2048x44N524288Crt186x44"
version = "0.1.0"
defaultTargets = ["RingGswBggGenerated", "RingGswBggProof"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxKheRingGswBgg"
path = ".."

# Modules written by `test_gpu_ring_gsw_boolean_bgg_parameters`
# (`tests/test_gpu_ring_gsw_boolean_bgg.rs`) for this parameter set.
[[lean_lib]]
name = "RingGswBggGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_keygen", "Stage_encrypt",
  "Stage_evaluate", "Stage_decrypt"
]

# The proof of the generated claim.
[[lean_lib]]
name = "RingGswBggProof"
roots = ["RingGswBggStep", "RingGswBggCertificate"]
