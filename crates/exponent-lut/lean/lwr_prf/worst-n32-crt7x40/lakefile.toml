name = "MxxExponentLutLwrWorstN32Crt7x40"
version = "0.1.0"
defaultTargets = ["LwrGenerated", "LwrProof"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLutLwr"
path = ".."

# Modules written by `lwr_prf_end_to_end` (`tests/lwr_prf.rs`) for this parameter set.
[[lean_lib]]
name = "LwrGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_payload", "Stage_mask",
  "Stage_preprocess", "Stage_encrypt", "Stage_online", "Stage_decode"
]

# The proof of the generated claim.
[[lean_lib]]
name = "LwrProof"
roots = ["LwrSetup", "LwrEncrypt", "LwrPreprocess", "LwrBlock0", "LwrBlock1", "LwrBlock2", "LwrBlock3", "LwrBlock4"]
