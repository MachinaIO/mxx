defaultTargets = ["MxxKhe"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../backends/lean/.lake/packages/mathlib"

[[require]]
name = "MxxBackends"
path = "../../backends/lean"

[[lean_lib]]
name = "MxxKhe"
roots = [
  "BggEncoding",
  "BggMultiplication",
  "GadgetsDecomposition",
  "GadgetsGadgetMatrix",
  "MxxKhe",
]
