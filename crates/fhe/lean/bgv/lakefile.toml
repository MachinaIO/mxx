name = "MxxFheBgv"
version = "0.1.0"
defaultTargets = ["BgvGenerated", "MxxFheBgv"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../../backends/lean/.lake/packages/mathlib"

[[require]]
name = "MxxBackends"
path = "../../../backends/lean"

[[require]]
name = "mxx-ir-core"
path = "../../../ir-core/lean"

# Modules written by `test_export_bgv_round_trip_claim` from the fixed BGV test parameters.
[[lean_lib]]
name = "BgvGenerated"
srcDir = "generated"
roots = [
  "Backend", "BgvSemantics", "Claim", "Ideal", "Stage_keygen", "Stage_encrypt_x",
  "Stage_encrypt_y", "Stage_multiply", "Stage_relinearize", "Stage_modswitch", "Stage_decrypt",
  "BgvTables", "Certificate"
]

# Handwritten proofs of the generated claim.
[[lean_lib]]
name = "MxxFheBgv"
roots = ["BgvStages", "BgvProof"]
