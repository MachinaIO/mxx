name = "MxxBgg"
version = "0.1.0"
defaultTargets = ["MxxBgg"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[require]]
name = "MxxPrimitives"
path = "../../primitives/lean"

[[require]]
name = "MxxGadgets"
path = "../../gadgets/lean"

[[require]]
name = "MxxIrCore"
path = "../../ir-core/lean"

[[lean_lib]]
name = "MxxBgg"
