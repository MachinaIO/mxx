name = "MxxExponentLutNandAverageN32Crt7x40"
version = "0.1.0"
defaultTargets = ["NandGenerated", "NandProof"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLutNand"
path = ".."

# Modules written by `nand_circuit_end_to_end` (`tests/nand_circuit.rs`) for this parameter set.
[[lean_lib]]
name = "NandGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_payload", "Stage_mask",
  "Stage_preprocess", "Stage_encrypt", "Stage_online_eval", "Stage_decode"
]

# The proof of the generated claim.
[[lean_lib]]
name = "NandProof"
roots = ["NandSetup", "NandEncrypt", "NandPreprocess", "NandOnlineEval0", "NandOnlineEval1", "NandOnlineEval2", "NandOnlineEval3", "NandCertificate"]
