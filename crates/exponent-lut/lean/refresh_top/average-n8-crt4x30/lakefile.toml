name = "MxxExponentLutRefreshTopAverageN8Crt4x30"
version = "0.1.0"
defaultTargets = ["RefreshTopGenerated"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLut"
path = "../.."

# Modules written by `refresh_top_round_trip` (`tests/refresh_top.rs`) for this parameter set.
[[lean_lib]]
name = "RefreshTopGenerated"
srcDir = "generated"
roots = ["Backend", "Claim", "Ideal", "Requirement_0", "Stage_decode", "Stage_encrypt_0_0", "Stage_encrypt_0_1", "Stage_mask", "Stage_online_eval_0_0", "Stage_online_eval_0_1", "Stage_payload", "Stage_preprocess_0_0", "Stage_preprocess_0_1"]

# The worst-case export of the same graph, renamed (written by `generator/gen_bridge.py`).
[[lean_lib]]
name = "RefreshTopWorst"
srcDir = "worst"
roots = ["W_Claim","W_Ideal","W_Requirement_0","W_Stage_decode","W_Stage_encrypt_0_0","W_Stage_encrypt_0_1","W_Stage_mask","W_Stage_online_eval_0_0","W_Stage_online_eval_0_1","W_Stage_payload","W_Stage_preprocess_0_0","W_Stage_preprocess_0_1"]

# Every average-case run is a worst-case run (written by `generator/gen_bridge.py`).
[[lean_lib]]
name = "RefreshTopBridge"
srcDir = "bridge"
moreLeanArgs = ["--tstack=262144"]
roots = ["BridgeRuns","Bridge_Ideal","Bridge_Requirement_0","Bridge_Stage_decode","Bridge_Stage_encrypt_0_0","Bridge_Stage_encrypt_0_1","Bridge_Stage_mask","Bridge_Stage_online_eval_0_0","Bridge_Stage_online_eval_0_1","Bridge_Stage_payload","Bridge_Stage_preprocess_0_0","Bridge_Stage_preprocess_0_1"]

