[package]
name = "mxx-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Execution backends, transcripts, artifacts, and liveness for mxx graph IR"

[features]
default = []
gpu = ["mxx-primitives/gpu"]

[dependencies]
mxx-ir-core.workspace = true
mxx-primitives.workspace = true
keccak-asm.workspace = true
libc.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
mxx-primitives = { workspace = true, features = ["test-gpu-sync"] }
serial_test.workspace = true
tempfile.workspace = true
