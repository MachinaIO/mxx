name = "MxxExponentLut"
version = "0.1.0"
defaultTargets = ["MxxExponentLut"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../ir-core/lean/.lake/packages/mathlib"

[[require]]
name = "mxx-ir-core"
path = "../../ir-core/lean"

# Lemmas that hold for every exponent-LUT program and parameter set.
[[lean_lib]]
name = "MxxExponentLut"
roots = ["ExponentAutomorphism", "ExponentScale", "ExponentEncoding", "ExponentGadget", "ExponentStacking", "ExponentWalsh", "ExponentLut", "ExponentDecode", "ExponentSampling", "ExponentPublic", "ExponentRuntime", "ExponentIterate", "ExponentDynamic", "ExponentErrorForm", "ExponentMaskForm", "ExponentFunctional"]
