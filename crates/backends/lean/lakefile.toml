name = "MxxBackends"
version = "0.1.0"
defaultTargets = ["MxxPrimitives", "MxxRuntime"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "MxxPrimitives"
roots = [
  "MxxPrimitives",
  "PrimitivesBounds",
  "PrimitivesCrtDecomposition",
  "PrimitivesCrtRadix",
  "PrimitivesMatrix",
  "PrimitivesNegacyclic",
  "PrimitivesPreimage",
  "PrimitivesRadix",
  "PrimitivesReduction",
  "PrimitivesSampling",
]

[[lean_lib]]
name = "MxxRuntime"
roots = [
  "MxxRuntime",
  "RuntimeHash",
  "RuntimeMatrixOps",
  "RuntimeModulusSwitch",
  "RuntimePrimitives",
]
