name = "mxx-security"
version = "0.1.0"
defaultTargets = ["MxxSecurity"]

# Mathlib is shared with `mxx-ir-core` by path, so both resolve to the same v4.35.0 checkout
# that VCVio also pins.
[[require]]
name = "mathlib"
path = "../.lake/packages/mathlib"

[[require]]
name = "mxx-ir-core"
path = ".."

# Pinned explicitly to mathcal-A's revision, so that one package set imports both (section 10,
# decision 4 of ARCHITECTURE-SPEC.md); update only together with mathcal-A.
[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "87bc1892fff1982e97cfd8c7303c9d1f2bfdc2f9"

[[lean_lib]]
name = "MxxSecurity"
leanOptions = { relaxedAutoImplicit = false }
roots = ["MxxSecurity"]
