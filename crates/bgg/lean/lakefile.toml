name = "MxxBgg"
version = "0.1.0"
defaultTargets = ["MxxBgg"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
path = "../../backends/lean/.lake/packages/mathlib"

[[require]]
name = "MxxBackends"
path = "../../backends/lean"

[[require]]
name = "MxxGadgets"
path = "../../gadgets/lean"

[[lean_lib]]
name = "MxxBgg"
roots = [
  "BggEncoding",
  "BggMultiplication",
  "MxxBgg",
]
