name = "MxxExponentLut"
version = "0.1.0"
defaultTargets = ["MxxExponentLut"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxPrimitives"
path = "../../primitives/lean"

[[require]]
name = "MxxBgg"
path = "../../bgg/lean"

[[require]]
name = "MxxRuntime"
path = "../../runtime/lean"

[[require]]
name = "mxx-ir-core"
path = "../../ir-core/lean"

[[lean_lib]]
name = "MxxExponentLut"
roots = ["ExponentBounds", "ExponentTransfers", "ExponentRefreshBounds", "ExponentAutomorphism", "ExponentReadout", "ExponentSetup", "ExponentCrt", "ExponentDecomposition", "ExponentProgram", "ExponentReadoutSetup", "ExponentMonomial", "ExponentSparseDecomposition", "ExponentRounding", "ExponentLut", "ExponentPairedSwitch", "ExponentTrace"]
