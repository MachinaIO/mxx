[package]
name = "mxx-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Polynomial, matrix, sampling, and GPU primitives for mxx"

[features]
default = []
gpu = []

[dependencies]
bigdecimal.workspace = true
bincode.workspace = true
bitvec.workspace = true
cxx = "1.0"
digest.workspace = true
itertools.workspace = true
keccak-asm.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
openfhe.workspace = true
rand.workspace = true
rayon.workspace = true
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serial_test.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cc.workspace = true
cxx-build = "1.0"

[[bench]]
name = "bench_matrix_mul_cpu"
harness = false

[[bench]]
name = "bench_matrix_mul_gpu"
harness = false

[[bench]]
name = "bench_small_rhs_gpu"
harness = false

[[bench]]
name = "bench_preimage_cpu"
harness = false

[[bench]]
name = "bench_preimage_gpu"
harness = false
