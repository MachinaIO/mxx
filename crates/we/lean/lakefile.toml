name = "MxxWe"
version = "0.1.0"
defaultTargets = ["MxxWe"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mxx-ir-core"
path = "../../ir-core/lean"

[[require]]
name = "MxxKhe"
path = "../../khe/lean"

[[lean_lib]]
name = "DiamondCandidate"
srcDir = "generated"
roots = [
  "Backend", "Claim", "DiamondProofParameters", "NumericCertificate",
  "Stage_encrypt", "Stage_decrypt", "Requirement_0", "Requirement_1", "Requirement_2", "Ideal"
]

[[lean_lib]]
name = "MxxWe"
# Candidate modules belong to DiamondCandidate above; handwritten proofs live here.
roots = [
  "Decoder", "Bounds", "Certificate",
  "DiamondAccumulatedSecretProof", "DiamondBooleanGateProof",
  "DiamondBoundedLayerProof", "DiamondBoundedLoopProof",
  "DiamondCircuitInitialProof", "DiamondCircuitLayerProof", "DiamondCircuitPublicProof",
  "DiamondCircuitRequirementProof", "DiamondClaimCircuitProof",
  "DiamondClaimCorrectnessProof", "DiamondClaimFinalProof", "DiamondClaimInjectorProof",
  "DiamondClaimStateProof", "DiamondDecryptInjectorProof", "DiamondEncodingRowProof",
  "DiamondEncryptedGateProof", "DiamondFinalDecryptionProof", "DiamondFinalEncodingProof",
  "DiamondFinalPublicProof", "DiamondGateProof", "DiamondIndexProof",
  "DiamondInitialStateProof", "DiamondInjectorLoopProof", "DiamondInjectorProof",
  "DiamondInjectorWitness", "DiamondInputContractProof", "DiamondIntegerInvariant",
  "DiamondLayerProof", "DiamondNumericProof", "DiamondPackingProof", "DiamondSelectorProof",
  "DiamondSelectorWitness", "DiamondTransitionProof", "DiamondWitnessPreimageProof"
]
