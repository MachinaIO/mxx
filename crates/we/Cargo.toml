[package]
name = "mxx-we"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Witness encryption constructions for mxx"

[features]
default = []
gpu = ["mxx-backends/gpu", "mxx-gadgets/gpu"]

[dependencies]
mxx-backends = { path = "../backends" }
mxx-gadgets = { path = "../gadgets" }
mxx-bgg = { path = "../bgg" }
mxx-dsl = { path = "../dsl" }
mxx-ir-core = { path = "../ir-core" }
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-integer = "0.1"
num-traits = "0.2.19"
rand = { version = "0.9.0", features = ["std_rng"] }
thiserror = "1"
tracing = "0.1"
keccak-asm = "0.1.4"
sha2 = "0.10"
tempfile = "3.19.1"

[dev-dependencies]
serial_test = { version = "3.5.0", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Excluded from the mxx workspace (see the root `Cargo.toml`); this manifest
# is its own workspace root.
[workspace]
