name: CI runner
on:
  workflow_dispatch:
    inputs:
      gpu_backend:
        description: Native GPU backend (runner must already have its SDK and OpenFHE)
        type: choice
        options: [cuda, hip]
        default: cuda
      gpu_device_tests:
        description: Run ignored GPU unit tests on the configured device runner
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt
      - run: cargo +nightly-2026-07-25 fmt --all --check

  run:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-25
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgmp-dev libasound2-dev

      - name: Checkout OpenFHE
        uses: actions/checkout@v4
        with:
          repository: MachinaIO/openfhe-development
          ref: main
          path: openfhe


      - name: Build OpenFHE
        run: |
          cd openfhe
          mkdir -p build && cd build
          cmake .. -DWITH_OPENMP=OFF
          make -j"$(nproc)"
          sudo make install

      - name: Update dynamic linker cache
        run: |
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/openfhe.conf
          sudo ldconfig

      - name: Verify OpenFHE installation
        run: ls -lah /usr/local/lib | grep OpenFHE

      - name: Run clippy memory
        run: cargo +nightly-2026-07-25 clippy --workspace --all-targets
        env:
          RUSTFLAGS: -A unused

      - name: Run test
        run: RUST_TEST_NOCAPTURE=1 cargo test -r --workspace --lib -- --test-threads=1

  gpu:
    # Configure MXX_CUDA_RUNNER / MXX_HIP_RUNNER as JSON runner labels only
    # after provisioning SDK, OpenFHE, Rust, and (for device tests) a GPU.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      ((inputs.gpu_backend == 'cuda' && vars.MXX_CUDA_RUNNER != '') ||
       (inputs.gpu_backend == 'hip' && vars.MXX_HIP_RUNNER != ''))
    runs-on: ${{ fromJSON(inputs.gpu_backend == 'cuda' && vars.MXX_CUDA_RUNNER || vars.MXX_HIP_RUNNER) }}
    timeout-minutes: 120
    env:
      MXX_GPU_BACKEND: ${{ inputs.gpu_backend }}
      HIP_ARCH: ${{ vars.MXX_HIP_ARCH }}
      CUDA_ARCH: ${{ vars.MXX_CUDA_ARCH || '89' }}
      CARGO_TARGET_DIR: target/gpu-${{ inputs.gpu_backend }}
    steps:
      - uses: actions/checkout@v4
      - name: GPU lib compile gate
        run: scripts/run_tests.sh --gpu-compile
      - name: GPU device unit gate (no integration tests)
        if: inputs.gpu_device_tests
        env:
          PYTHONPATH: scripts/lib
        run: python3 -m repo_validation maybe-run-gpu-repeat --force

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - run
      - fmt
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
