name = "MxxExponentLutLwrAverageN65536Crt36x40"
version = "0.1.0"
defaultTargets = ["LwrGenerated", "LwrProof", "LwrH2"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLutLwr"
path = ".."

# Modules written by `lwr_prf_end_to_end` (`tests/lwr_prf.rs`) for this parameter set.
[[lean_lib]]
name = "LwrGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_payload", "Stage_mask",
  "Stage_preprocess", "Stage_encrypt", "Stage_online_eval", "Stage_decode"
]

# The proof of the generated claim, written by `../generator/gen.py`. The certificate chains the
# 34 blocks in one proof, whose kernel check needs a larger thread stack than the default.
[[lean_lib]]
name = "LwrProof"
moreLeanArgs = ["--tstack=512000"]
roots = [
"LwrSetup", "LwrInputs", "LwrEncrypt", "LwrPreprocess", "LwrCells", "LwrBlock0", "LwrBlock1",
  "LwrBlock2", "LwrBlock3", "LwrBlock4", "LwrBlock5", "LwrBlock6", "LwrBlock7", "LwrBlock8",
  "LwrBlock9", "LwrBlock10", "LwrBlock11", "LwrBlock12", "LwrBlock13", "LwrBlock14", "LwrBlock15",
  "LwrBlock16", "LwrBlock17", "LwrBlock18", "LwrBlock19", "LwrBlock20", "LwrBlock21", "LwrBlock22",
  "LwrBlock23", "LwrBlock24", "LwrBlock25", "LwrBlock26", "LwrBlock27", "LwrBlock28", "LwrBlock29",
  "LwrBlock30", "LwrBlock31", "LwrBlock32", "LwrBlock33", "LwrLut", "LwrCertificate"
]

# The certificate under H2: the errors named (`*E`), the model of a run (`LwrModel*`, `LwrChain*`),
# and the decomposition of the decoded coefficient with its bounds (`LwrH2*`).
[[lean_lib]]
name = "LwrH2"
moreLeanArgs = ["--tstack=4000000"]
roots = [
"LwrEncryptE", "LwrPreprocessE", "LwrErrorCommon", "LwrBlockE0", "LwrBlockE1", "LwrBlockE2",
  "LwrBlockE3", "LwrBlockE4", "LwrBlockE5", "LwrBlockE6", "LwrBlockE7", "LwrBlockE8", "LwrBlockE9",
  "LwrBlockE10", "LwrBlockE11", "LwrBlockE12", "LwrBlockE13", "LwrBlockE14", "LwrBlockE15",
  "LwrBlockE16", "LwrBlockE17", "LwrBlockE18", "LwrBlockE19", "LwrBlockE20", "LwrBlockE21",
  "LwrBlockE22", "LwrBlockE23", "LwrBlockE24", "LwrBlockE25", "LwrBlockE26", "LwrBlockE27",
  "LwrBlockE28", "LwrBlockE29", "LwrBlockE30", "LwrBlockE31", "LwrBlockE32", "LwrBlockE33",
  "LwrLutE", "LwrModelBase", "LwrModel0", "LwrModel1", "LwrModel2", "LwrModel3", "LwrModel4",
  "LwrModel5", "LwrModel6", "LwrModel7", "LwrModel8", "LwrModel9", "LwrModel10", "LwrModel11",
  "LwrModel12", "LwrModel13", "LwrModel14", "LwrModel15", "LwrModel16", "LwrModel17", "LwrModel18",
  "LwrModel19", "LwrModel20", "LwrModel21", "LwrModel22", "LwrModel23", "LwrModel24", "LwrModel25",
  "LwrModel26", "LwrModel27", "LwrModel28", "LwrModel29", "LwrModel30", "LwrModel31", "LwrModel32",
  "LwrModel33", "LwrModelLut", "LwrChainAll", "LwrChainFinal", "LwrH2Model", "LwrH2Bounds",
  "LwrH2Agree", "LwrH2Cert"
]
