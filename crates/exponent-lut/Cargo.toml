[package]
name = "mxx-exponent-lut"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Direct private LUT evaluation over BGG+ encodings"

[features]
default = []
gpu = ["mxx-primitives/gpu", "mxx-runtime/gpu"]

[dependencies]
mxx-bgg.workspace = true
mxx-dsl.workspace = true
mxx-ir-core.workspace = true
mxx-primitives.workspace = true
mxx-runtime.workspace = true
bigdecimal.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true

[dev-dependencies]
rayon.workspace = true
tempfile.workspace = true
mxx-bench-estimator = { workspace = true, features = ["gpu"] }
mxx-primitives = { workspace = true, features = ["test-gpu-sync"] }
serial_test.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
