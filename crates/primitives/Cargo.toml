[package]
name = "mxx-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Polynomial, matrix, sampling, and GPU primitives for mxx"

[features]
default = []
disk = ["dep:libc", "dep:memmap2"]
gpu = []
# Internal feature enabled by workspace dev-dependencies to preserve test-only Drop synchronization.
test-gpu-sync = []

[dependencies]
bigdecimal.workspace = true
bincode.workspace = true
bitvec.workspace = true
digest.workspace = true
itertools.workspace = true
keccak-asm.workspace = true
libc = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
num-bigint.workspace = true
num-traits.workspace = true
openfhe.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serial_test.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cc.workspace = true

[[bench]]
name = "bench_matrix_mul_cpu"
harness = false

[[bench]]
name = "bench_matrix_mul_gpu"
harness = false

[[bench]]
name = "bench_preimage_cpu"
harness = false

[[bench]]
name = "bench_preimage_gpu"
harness = false
