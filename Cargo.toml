[workspace]
resolver = "3"
members = [
    "crates/ir-core",
    "crates/ir-symbolic",
    "crates/runtime",
    "crates/bench-estimator",
    "crates/bgg",
    "crates/primitives",
    "crates/gadgets",
    "crates/func-enc",
    "crates/we",
    "crates/io",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mxx-primitives = { path = "crates/primitives" }
mxx-gadgets = { path = "crates/gadgets" }
mxx-func-enc = { path = "crates/func-enc" }
mxx-we = { path = "crates/we" }
mxx-io = { path = "crates/io" }
mxx-ir-core = { path = "crates/ir-core" }
mxx-ir-symbolic = { path = "crates/ir-symbolic" }
mxx-runtime = { path = "crates/runtime" }
mxx-bench-estimator = { path = "crates/bench-estimator" }
mxx-bgg = { path = "crates/bgg" }
bigdecimal = "0.4"
bincode = "2.0.1"
bitvec = "1"
cc = "1"
dashmap = "6.1.0"
digest = "0.10"
itertools = "0.14.0"
keccak-asm = "0.1.4"
libc = "0.2"
memory-stats = "1.2.0"
memmap2 = "0.9.5"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-integer = "0.1"
num-traits = "0.2.19"
openfhe = { git = "https://github.com/MachinaIO/openfhe-rs.git" }
rand = { version = "0.9.0", features = ["std_rng"] }
rayon = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serial_test = { version = "3.5.0", default-features = false }
tempfile = "3.19.1"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "abort"
codegen-units = 16

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
