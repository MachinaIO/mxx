name = "MxxPe"
version = "0.1.0"
defaultTargets = ["MxxPe"]

[leanOptions]
# Lean 4.35 checks the type of a metavariable assignment at instances transparency, which
# rejects these proofs' lambdas used as `Matrix` arguments; keep the earlier check.
backward.isDefEq.respectTransparency.types = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLut"
path = "../../exponent-lut/lean"

# Lemmas that hold for every predicate encryption parameter set.
[[lean_lib]]
name = "MxxPe"
roots = ["PeDynamic", "PeTail", "PeCompact", "PePublicRows"]
