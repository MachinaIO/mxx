name = "MxxExponentLutPublicIpAverageN32Crt2x40"
version = "0.1.0"
defaultTargets = ["PublicIpGenerated", "PublicIpProof"]

[leanOptions]
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "MxxExponentLutPublicIp"
path = ".."

# Modules written by `public_ip_end_to_end` (`tests/public_ip.rs`) for this parameter set.
[[lean_lib]]
name = "PublicIpGenerated"
srcDir = "generated"
roots = [
  "Backend", "Claim", "Ideal", "Requirement_0", "Stage_mask", "Stage_encrypt",
  "Stage_online_eval", "Stage_decode"
]

# The proof of the generated claim.
[[lean_lib]]
name = "PublicIpProof"
roots = ["PublicIpSetup", "PublicIpInputs", "PublicIpEncrypt", "PublicIpOnlineEval", "PublicIpDecode", "PublicIpCertificate"]
